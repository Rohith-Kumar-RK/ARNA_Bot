name: Python arna_bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.15.0
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
joblib
    - name: Verify model files exist
      run: |
        ls -la Models/
        test -f Models/best_model.keras || echo "⚠️  Keras model missing"
        test -f Models/identify_CNN.keras || echo "⚠️  ML model missing"
    
    - name: Test Keras Model Loading & Inference
      run: |
        python -c "
        import tensorflow as tf
        import numpy as np
        from PIL import Image
        
        print('🔄 Loading Keras model...')
        model = tf.keras.models.load_model('Models/best_model.keras')
        print('✅ Keras model loaded successfully!')
        print(f'📊 Model summary: {model.summary()[:3]}')

name: Python arna_app

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/src/requirements.txt
          pip install pytest

      # Run tests
      - name: Run tests
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

        run: |
          pytest